<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude To-Do</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f13;
      --surface: #1a1a24;
      --surface2: #22222f;
      --border: #2e2e3e;
      --accent: #7c6af7;
      --accent-dim: #5b4fd4;
      --text: #e8e8f0;
      --text-dim: #8888aa;
      --green: #4ade80;
      --red: #f87171;
      --yellow: #fbbf24;
      --high: #f87171;
      --medium: #fbbf24;
      --low: #60a5fa;
      --radius: 10px;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px;
    }

    .app {
      max-width: 760px;
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      background: linear-gradient(135deg, #a78bfa, #7c6af7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header .subtitle {
      font-size: 0.85rem;
      color: var(--text-dim);
      margin-top: 2px;
    }

    .brain-dump-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 24px;
    }

    .brain-dump-section h2 {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
    }

    textarea {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      line-height: 1.6;
      padding: 14px;
      resize: vertical;
      min-height: 110px;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    textarea::placeholder { color: var(--text-dim); }

    .dump-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 10px 20px;
      transition: all 0.15s;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary:hover { background: #6a5ae0; }
    .btn-primary:disabled { background: var(--surface2); color: var(--text-dim); cursor: not-allowed; }

    .btn-ghost {
      background: transparent;
      color: var(--text-dim);
      border: 1px solid var(--border);
    }

    .btn-ghost:hover { color: var(--text); border-color: var(--text-dim); }

    .status-msg {
      font-size: 0.85rem;
      padding: 2px 0;
    }
    .status-msg.success { color: var(--green); }
    .status-msg.error { color: var(--red); }
    .status-msg.info { color: var(--text-dim); }

    /* Spinner */
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    .loading .spinner { display: inline-block; }
    .loading .btn-icon { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Filters */
    .filters {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 6px 14px;
      font-size: 0.82rem;
      background: var(--surface);
      color: var(--text-dim);
      border: 1px solid var(--border);
      border-radius: 20px;
    }

    .filter-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .filter-btn:hover:not(.active) {
      color: var(--text);
      border-color: var(--text-dim);
    }

    .spacer { flex: 1; }

    .clear-btn {
      padding: 6px 14px;
      font-size: 0.82rem;
      background: transparent;
      color: var(--text-dim);
      border: 1px solid var(--border);
      border-radius: 20px;
    }

    .clear-btn:hover { color: var(--red); border-color: var(--red); }

    /* Stats bar */
    .stats {
      display: flex;
      gap: 20px;
      font-size: 0.82rem;
      color: var(--text-dim);
      margin-bottom: 16px;
    }

    .stats span { display: flex; align-items: center; gap: 5px; }

    /* Todo list */
    .todo-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .todo-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      transition: all 0.15s;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .todo-item:hover { border-color: var(--accent-dim); }

    .todo-item.completed {
      opacity: 0.5;
      border-style: dashed;
    }

    .todo-checkbox {
      width: 20px; height: 20px;
      border-radius: 50%;
      border: 2px solid var(--border);
      flex-shrink: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 1px;
      transition: all 0.15s;
    }

    .todo-checkbox:hover { border-color: var(--accent); }

    .todo-item.completed .todo-checkbox {
      background: var(--green);
      border-color: var(--green);
    }

    .todo-checkbox svg { display: none; }
    .todo-item.completed .todo-checkbox svg { display: block; }

    .todo-content { flex: 1; min-width: 0; }

    .todo-text {
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--text);
      word-break: break-word;
    }

    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: var(--text-dim);
    }

    .todo-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
    }

    .tag {
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    .tag-category {
      background: rgba(124, 106, 247, 0.15);
      color: #a78bfa;
      border: 1px solid rgba(124, 106, 247, 0.3);
    }

    .tag-priority-high { background: rgba(248,113,113,0.12); color: var(--high); border: 1px solid rgba(248,113,113,0.3); }
    .tag-priority-medium { background: rgba(251,191,36,0.12); color: var(--medium); border: 1px solid rgba(251,191,36,0.3); }
    .tag-priority-low { background: rgba(96,165,250,0.12); color: var(--low); border: 1px solid rgba(96,165,250,0.3); }

    .todo-date {
      font-size: 0.72rem;
      color: var(--text-dim);
      margin-left: auto;
    }

    .todo-delete {
      background: transparent;
      border: none;
      color: var(--text-dim);
      padding: 4px;
      border-radius: 6px;
      opacity: 0;
      transition: all 0.15s;
      flex-shrink: 0;
    }

    .todo-item:hover .todo-delete { opacity: 1; }
    .todo-delete:hover { color: var(--red); background: rgba(248,113,113,0.1); }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-dim);
    }

    .empty-state .icon { font-size: 3rem; margin-bottom: 16px; }
    .empty-state h3 { font-size: 1.1rem; color: var(--text); margin-bottom: 8px; }
    .empty-state p { font-size: 0.875rem; }

    /* Category groups */
    .category-group { margin-bottom: 20px; }

    .category-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-dim);
    }

    .category-header .count {
      background: var(--surface2);
      color: var(--text-dim);
      padding: 1px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
    }

    .category-header::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>Claude To-Do</h1>
        <div class="subtitle">Brain dump anything — Claude organizes it for you</div>
      </div>
    </header>

    <section class="brain-dump-section">
      <h2>Brain Dump</h2>
      <textarea
        id="brainDumpInput"
        placeholder="Dump everything on your mind... e.g. 'need to call mom back, pick up dry cleaning, finish Q3 report by Friday URGENT, buy birthday gift for Alex, schedule dentist'"
      ></textarea>
      <div class="dump-actions">
        <button class="btn-primary" id="parseBtn" onclick="parseBrainDump()">
          <span class="btn-icon">✦</span>
          <span class="spinner"></span>
          <span id="parseBtnText">Parse with Claude</span>
        </button>
        <div id="statusMsg" class="status-msg"></div>
      </div>
    </section>

    <div class="filters">
      <button class="filter-btn active" data-filter="all" onclick="setFilter('all', this)">All</button>
      <button class="filter-btn" data-filter="active" onclick="setFilter('active', this)">Active</button>
      <button class="filter-btn" data-filter="completed" onclick="setFilter('completed', this)">Completed</button>
      <span class="spacer"></span>
      <button class="clear-btn" onclick="clearCompleted()">Clear completed</button>
    </div>

    <div class="stats" id="stats"></div>

    <div id="todoContainer"></div>
  </div>

  <script>
    let todos = [];
    let currentFilter = 'all';

    // ---- API calls ----
    async function loadTodos() {
      const res = await fetch('/api/todos');
      const data = await res.json();
      if (data.success) {
        todos = data.todos;
        render();
      }
    }

    async function parseBrainDump() {
      const input = document.getElementById('brainDumpInput');
      const text = input.value.trim();
      if (!text) return;

      const btn = document.getElementById('parseBtn');
      const msgEl = document.getElementById('statusMsg');
      const btnText = document.getElementById('parseBtnText');

      btn.disabled = true;
      btn.classList.add('loading');
      btnText.textContent = 'Parsing…';
      msgEl.textContent = '';
      msgEl.className = 'status-msg';

      try {
        const res = await fetch('/api/brain-dump', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text }),
        });
        const data = await res.json();
        if (data.success) {
          todos = [...data.added, ...todos];
          input.value = '';
          render();
          msgEl.textContent = data.message;
          msgEl.className = 'status-msg success';
        } else {
          msgEl.textContent = data.error || 'Something went wrong';
          msgEl.className = 'status-msg error';
        }
      } catch (err) {
        msgEl.textContent = 'Network error — is the server running?';
        msgEl.className = 'status-msg error';
      } finally {
        btn.disabled = false;
        btn.classList.remove('loading');
        btnText.textContent = 'Parse with Claude';
      }
    }

    async function toggleTodo(id) {
      const res = await fetch(`/api/todos/${id}/toggle`, { method: 'PATCH' });
      const data = await res.json();
      if (data.success) {
        todos = todos.map(t => t.id === id ? data.todo : t);
        render();
      }
    }

    async function deleteTodo(id) {
      const res = await fetch(`/api/todos/${id}`, { method: 'DELETE' });
      const data = await res.json();
      if (data.success) {
        todos = todos.filter(t => t.id !== id);
        render();
      }
    }

    async function clearCompleted() {
      const res = await fetch('/api/todos/completed/clear', { method: 'DELETE' });
      const data = await res.json();
      if (data.success) {
        todos = todos.filter(t => !t.completed);
        render();
      }
    }

    // ---- Filters ----
    function setFilter(filter, el) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      render();
    }

    // ---- Render ----
    function formatDate(iso) {
      const d = new Date(iso);
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    function getFilteredTodos() {
      if (currentFilter === 'active') return todos.filter(t => !t.completed);
      if (currentFilter === 'completed') return todos.filter(t => t.completed);
      return todos;
    }

    function render() {
      const filtered = getFilteredTodos();
      const active = todos.filter(t => !t.completed).length;
      const completed = todos.filter(t => t.completed).length;

      // Stats
      document.getElementById('stats').innerHTML = `
        <span>📋 ${active} remaining</span>
        <span>✅ ${completed} done</span>
        <span>📦 ${todos.length} total</span>
      `;

      const container = document.getElementById('todoContainer');

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="icon">${currentFilter === 'completed' ? '🎉' : '✨'}</div>
            <h3>${currentFilter === 'completed' ? 'Nothing completed yet' : currentFilter === 'active' ? 'All done!' : 'Your list is empty'}</h3>
            <p>${currentFilter === 'all' ? 'Dump your thoughts above — Claude will organize them for you.' : ''}</p>
          </div>`;
        return;
      }

      // Group by category
      const groups = {};
      for (const todo of filtered) {
        const cat = todo.category || 'Other';
        if (!groups[cat]) groups[cat] = [];
        groups[cat].push(todo);
      }

      const html = Object.entries(groups).sort(([a], [b]) => a.localeCompare(b)).map(([cat, items]) => `
        <div class="category-group">
          <div class="category-header">
            ${cat}
            <span class="count">${items.length}</span>
          </div>
          <div class="todo-list">
            ${items.map(todo => `
              <div class="todo-item ${todo.completed ? 'completed' : ''}" id="todo-${todo.id}">
                <div class="todo-checkbox" onclick="toggleTodo(${todo.id})" title="Toggle complete">
                  <svg width="12" height="10" viewBox="0 0 12 10" fill="none">
                    <path d="M1 5L4.5 8.5L11 1.5" stroke="#0f0f13" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </div>
                <div class="todo-content">
                  <div class="todo-text">${escapeHtml(todo.text)}</div>
                  <div class="todo-meta">
                    <span class="tag tag-priority-${todo.priority}">${todo.priority}</span>
                    <span class="todo-date">${formatDate(todo.created_at)}</span>
                  </div>
                </div>
                <button class="todo-delete" onclick="deleteTodo(${todo.id})" title="Delete">
                  <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                    <path d="M2 2L12 12M12 2L2 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                  </svg>
                </button>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');

      container.innerHTML = html;
    }

    function escapeHtml(text) {
      return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // Allow Cmd/Ctrl+Enter to submit
    document.getElementById('brainDumpInput').addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') parseBrainDump();
    });

    // Initial load
    loadTodos();
  </script>
</body>
</html>
